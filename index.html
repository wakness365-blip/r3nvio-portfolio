<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>R3NVIO - Motion Design / Editing</title>
    <meta
      name="description"
      content="R3NVIO - видеомонтаж, motion design и визуальная подача динамичного контента для YouTube, соцсетей, промо и коротких форматов."
    />
    <link rel="icon" type="image/png" href="/assets/r3nvio_icon_offwhite.png" />
    <style>
      html {
        min-height: 100%;
        background: #0d0c0a;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(ellipse 100% 70% at 50% 10%, rgba(201, 168, 92, 0.08), transparent 58%),
          radial-gradient(ellipse 72% 64% at 84% 82%, rgba(124, 46, 46, 0.09), transparent 64%),
          linear-gradient(180deg, rgba(13, 12, 10, 0.8), rgba(13, 12, 10, 0.96));
        color: #f6f1e8;
      }

      #root {
        min-height: 100vh;
        opacity: 0;
        transition: opacity 0.18s ease;
      }

      html.app-ready #root {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
