<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>R3NVIO - Motion Design / Editing</title>
    <meta
      name="description"
      content="R3NVIO - видеомонтаж, motion design и визуальная подача динамичного контента для YouTube, соцсетей, промо и коротких форматов."
    />
    <link rel="icon" type="image/png" href="/assets/r3nvio_icon_offwhite.png" />
    <style>
      html {
        min-height: 100%;
        background: #050608;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(ellipse 92% 68% at 50% 6%, rgba(176, 191, 226, 0.12), transparent 58%),
          radial-gradient(ellipse 70% 62% at 84% 84%, rgba(71, 96, 145, 0.14), transparent 64%),
          linear-gradient(180deg, rgba(5, 6, 8, 0.92), rgba(7, 10, 14, 0.98));
        color: #f6f1e8;
      }

      #root {
        min-height: 100vh;
        opacity: 0;
        transition: opacity 0.18s ease;
      }

      html.app-ready #root {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
